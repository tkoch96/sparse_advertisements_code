[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Markers let us cheaply gate slow/integration tests.
markers =
    unit: fast in-process tests (no Ray, no subprocesses).
    integration: spawns Ray actors or workers; slower, requires `ray`.
    gurobi: requires a working Gurobi license on this machine.
    slow: takes more than a few seconds.
    benchmark: timing/throughput probe. Prints numbers but rarely asserts on them.
# Stop after first failure by default; override with `pytest --maxfail=0`.
addopts = -ra --maxfail=1 --strict-markers
filterwarnings =
    ignore::DeprecationWarning
